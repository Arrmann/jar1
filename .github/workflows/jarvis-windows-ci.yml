name: JARVIS Windows CI

on:
  push:
    branches:
      - chatgpt/aura-jarvis-integration
  workflow_dispatch:

concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: pygame-ce==2.5.8
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q aura main.py

      - name: Runtime and catalog smoke tests
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          from aura.core.command_catalog import CommandCatalog
          from aura.actions.jarvis_commands import JarvisCommandService
          from aura.llm import create_llm
          from aura.core.custom_commands import CustomCommandStore, CustomCommandError
          from aura.ui.dashboard_widget import DashboardWidget
          from aura.ui.custom_commands_widget import CustomCommandsWidget
          import tempfile

          class TestConfig:
              def get(self, key, default=None):
                  return {"llm.provider": "offline"}.get(key, default)

          assert create_llm(TestConfig()).name == "offline"
          with tempfile.TemporaryDirectory() as temp_dir:
              store = CustomCommandStore(Path(temp_dir) / "custom_commands.json")
              scenario = store.upsert({
                  "name": "Рабочий режим",
                  "phrases_ru": ["рабочий режим", "рабочий режим для офиса", "собери рабочее место"],
                  "enabled": True,
                  "steps": [
                      {"type": "command", "command_id": "open_telegram_web"},
                      {"type": "wait", "seconds": 0.2},
                      {"type": "speak", "text": "Рабочий режим готов."}
                  ]
              })
              matched = store.match("Джарвис, рабочий режим")
              assert matched and matched["command"]["id"] == scenario["id"]
              assert store.match("Джарвис, рабочий режим для офиса")["command"]["id"] == scenario["id"]
              assert store.import_data(store.export_data()) == 1
              conflict_rejected = False
              try:
                  store.upsert({
                      "name": "Пересекающийся сценарий",
                      "phrases_ru": ["рабочий режим вечером"],
                      "steps": [{"type": "speak", "text": "Готово"}]
                  })
              except CustomCommandError:
                  conflict_rejected = True
              assert conflict_rejected, "Overlapping triggers must be rejected across scenarios"
              rejected = False
              try:
                  store.validate({
                      "name": "Unsafe",
                      "phrases_ru": ["unsafe phrase"],
                      "steps": [{"type": "open_url", "url": "powershell://calc"}]
                  })
              except CustomCommandError:
                  rejected = True
              assert rejected, "Unsafe URL scheme must be rejected"
          assert DashboardWidget is not None and CustomCommandsWidget is not None
          catalog = CommandCatalog()
          assert len(catalog.commands) == 308, len(catalog.commands)
          assert len(catalog.by_id) == 308

          all_ids = set(catalog.by_id)
          cases = [
              ("Джарвис, открой ютуб", "open_youtube"),
              ("Джарвис, громче", "volume_up"),
              ("Джарвис, поставь таймер на 5 минут", "timer_set"),
              ("Джарвис, сделай скриншот", "screenshot"),
              ("Джарвис, поговорим", "chat_start"),
              ("Джарвис, закончи чат", "chat_stop"),
              ("Джарвис, клик мыши", "mouse_left"),
              ("Джарвис, правый клик", "mouse_right"),
              ("Джарвис, курсор вправо", "mouse_right_move"),
              ("Джарвис, открой телеграм веб", "open_telegram_web"),
              ("Джарвис, диктуй", "dictate"),
              ("Джарвис, стоп диктовка", "dictate_stop"),
          ]
          for phrase, expected in cases:
              result = catalog.match(phrase, enabled_ids=all_ids, wake_phrase="джарвис")
              assert result and result["command_id"] == expected, (phrase, result, expected)

          assert JarvisCommandService._duration_seconds("5 минут") == 300
          assert JarvisCommandService._duration_seconds("30 секунд") == 30
          assert {"chat_start", "chat_stop", "dictate", "dictate_stop", "mouse_left", "mouse_right", "mouse_double", "mouse_up", "mouse_down", "mouse_left_move", "mouse_right_move", "open_telegram_web"} <= all_ids
          service = JarvisCommandService(None, None)
          assert service.execute("dictate")["success"] and service.dictation_active
          assert service.execute("dictate_stop")["success"] and not service.dictation_active
          print("Custom workflows: create/match/import/export + URL validation passed")
          print("Dashboard and custom scenario UI imports: passed")
          print("Catalog:", len(catalog.commands))
          print("Groups:", catalog.data.get("categories"))
          print("Voice alias matching:", len(cases), "passed")
          print("Timer parsing: passed")
          '@ | Set-Content -Encoding utf8 .ci_smoke.py
          python .ci_smoke.py

      - name: Verify dependency imports
        run: |
          python -c "import PySide6, faster_whisper, pygame, PIL, sounddevice, edge_tts, keyring, pycaw, comtypes; import keyring.backends.Windows; print('Runtime imports: OK')"
          python -m pip check

      - name: Build desktop executable
        shell: pwsh
        run: |
          ./build.ps1
          if (-not (Test-Path "dist/JARVIS.exe")) { throw "PyInstaller did not produce dist/JARVIS.exe" }
          Get-Item "dist/JARVIS.exe" | Format-List Name,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Build one-click installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\\ISCC.exe"
          New-Item -ItemType Directory -Force "dist-installer" | Out-Null
          & $iscc /Qp "installer/JARVIS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          Get-ChildItem "dist-installer" | Format-Table Name,Length

      - name: Upload one-click Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64-Setup
          path: dist-installer/JARVIS-Assistant-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64-EXE
          path: dist/JARVIS.exe
          if-no-files-found: error
          retention-days: 14
