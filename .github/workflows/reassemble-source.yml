name: Temporary source archive inspection

on:
  push:
    branches:
      - chatgpt/reassemble-inspect

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout archive parts
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Reassemble, validate, and extract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(JARVIS.7z.[0-9][0-9][0-9])
          test "${#parts[@]}" -eq 27
          cat "${parts[@]}" > JARVIS.7z
          7z t JARVIS.7z
          7z x JARVIS.7z -osource -y

      - name: Build source inventory and lightweight source bundle
        shell: bash
        run: |
          set -euo pipefail
          find source -type f -printf '%s\t%p\n' | sort -nr > source-manifest.tsv
          {
            echo "=== FILE COUNTS BY EXTENSION ==="
            find source -type f | awk '
              {
                n=split($0,a,"/");
                name=a[n];
                if (name !~ /\\./) ext="[no extension]";
                else { sub(/^.*\\./,"",name); ext="." tolower(name); }
                count[ext]++
              }
              END { for (e in count) printf "%7d %s\n",count[e],e }
            ' | sort -nr
            echo
            echo "=== TOP 250 LARGEST FILES ==="
            head -250 source-manifest.tsv
            echo
            echo "=== ROOT AND SECOND-LEVEL TREE ==="
            find source -mindepth 1 -maxdepth 2 -print | sort | head -500
          } > source-summary.txt
          find source -type f -size -20M \
            ! -path '*/node_modules/*' \
            ! -path '*/site-packages/*' \
            ! -path '*/.venv/*' \
            ! -path '*/venv/*' \
            ! -path '*/__pycache__/*' \
            ! -path '*/.git/*' \
            ! -path '*/.cache/*' \
            ! -path '*/cache/*' \
            ! -path '*/Cache/*' \
            ! -path '*/dist/*' \
            ! -path '*/build/*' \
            ! -path '*/models/*' \
            ! -path '*/Model/*' \
            ! -path '*/model/*' \
            ! -path '*/weights/*' \
            \( -iname '*.py' -o -iname '*.pyw' -o -iname '*.pyi' \
              -o -iname '*.lua' -o -iname '*.ahk' \
              -o -iname '*.js' -o -iname '*.jsx' -o -iname '*.ts' -o -iname '*.tsx' \
              -o -iname '*.html' -o -iname '*.htm' -o -iname '*.css' -o -iname '*.scss' \
              -o -iname '*.json' -o -iname '*.jsonc' -o -iname '*.yaml' -o -iname '*.yml' \
              -o -iname '*.toml' -o -iname '*.ini' -o -iname '*.cfg' -o -iname '*.conf' \
              -o -iname '*.xml' -o -iname '*.txt' -o -iname '*.md' -o -iname '*.rst' \
              -o -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.sh' \
              -o -iname '*.sql' -o -iname '*.lock' -o -iname '*.spec' \
              -o -iname '*.cs' -o -iname '*.csproj' -o -iname '*.sln' -o -iname '*.xaml' \
              -o -iname '*.c' -o -iname '*.h' -o -iname '*.cpp' -o -iname '*.hpp' \
              -o -iname '*.qml' -o -iname '*.ui' -o -iname '*.qss' -o -iname '*.resx' \
              -o -iname '*.plist' -o -iname '*.gradle' -o -iname '*.properties' \
              -o -iname '*.go' -o -iname '*.rs' -o -iname '*.java' -o -iname '*.kt' \
              -o -iname '*.svg' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \
              -o -iname '*.webp' -o -iname '*.ico' -o -iname '*.gif' -o -iname '*.bmp' \
              -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \
              -o -iname '*.ttf' -o -iname '*.otf' -o -iname '*.dll' -o -iname '*.pyd' \
              -o -iname 'readme*' -o -iname 'license*' -o -iname '.gitignore' \
              -o -iname '.env.example' -o -iname 'makefile' -o -iname 'dockerfile' \) \
            -print0 > source-files.list
          tar --null -T source-files.list -czf jarvis-source-code.tar.gz
          echo "Selected source/resource files: $(wc -l < source-files.list)"
          echo "Bundle size: $(du -h jarvis-source-code.tar.gz | cut -f1)"
          echo "Summary size: $(du -h source-summary.txt | cut -f1)"

      - name: Upload source bundle and inventory
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-source-review
          path: |
            jarvis-source-code.tar.gz
            source-summary.txt
            source-manifest.tsv
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
