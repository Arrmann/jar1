]

[[commands]]
id = "browser_close"
type = "cli"
cli_cmd = "powershell"
cli_args = ["-NoProfile", "-Command", "Stop-Process -Name chrome,msedge,firefox,opera,opera_gx,brave,browser -ErrorAction SilentlyContinue"]
sounds.ru = ["ok1", "ok2", "ok3", "ok4"]
sounds.en = ["ok1", "ok2", "ok3", "ok4", "ok5"]
phrases.ru = [
    "закрой браузер",
    "закрой все браузеры",
    "выключи браузер",
    "убери браузер",
]
phrases.en = [
    "close browser",
    "close all browsers",
    "exit browser",
]

