# Obsidian voice inbox — paid feature (not in demo whitelist)

[[commands]]
id = "obsidian_write"
type = "lua"
script = "obsidian-write.lua"
sandbox = "full"
timeout = 8000
description = "Write a new note into the Obsidian vault Inbox"
sounds.ru = ["ok1", "ok2", "ok3", "ok4", "ok5"]
sounds.en = ["ok1", "ok2", "ok3", "ok4", "ok5"]
phrases.ru = [
    "запиши в заметки",
    "запиши в заметку",
    "запиши заметки",
    "запиши заметку",
    "записать в заметки",
    "добавь в заметки",
    "добавь заметки",
    "новая заметка",
]
phrases.en = [
    "write note",
    "write to notes",
    "add note",
]

