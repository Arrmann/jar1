# Popular / competitive commands (Luxify & Vibe parity + RU everyday needs)

[[commands]]
id = "browser_back"
type = "lua"
script = "browser-back.lua"
sandbox = "full"
timeout = 5000
sounds.ru = ["cmd_browser_back"]
sounds.en = ["ok1", "ok2", "ok3", "ok4", "ok5"]
phrases.ru = [
    "страница назад",
    "вернись назад",
    "браузер назад",
]
phrases.en = ["go back", "browser back", "page back"]

